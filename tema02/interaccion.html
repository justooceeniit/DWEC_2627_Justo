<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tema 2 - Interacción JS</title>

  <!-- CSS de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- barra de navegación, igual que en index.html -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">Justo (DWEC)</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">A. Navegadores y Motores</a></li>
          <li class="nav-item"><a class="nav-link active" href="interaccion.html">B. Interacción JS</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- parte B -->
  <main class="container">
      <h1 class="mb-4">Parte B: Interacción con JavaScript</h1>

      <!-- tarjeta y los 3 botones interactivos -->
      <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
              Panel de Pruebas Interactivas
          </div>
          <div class="card-body">
              <p class="card-text text-muted mb-4">
                  Haz clic en los botones para comprobar las respuestas mediante alertas visuales o registros en la consola de desarrollo (F12).
              </p>
              
              <div class="d-grid gap-3 col-md-6 mx-auto">
                  <!-- boton :saludar -->
                  <button type="button" class="btn btn-outline-primary btn-lg" onclick="mostrarSaludo()">
                      1. Saludar
                  </button>

                  <!-- boton 2= simular error -->
                  <button type="button" class="btn btn-outline-danger btn-lg" onclick="simularError()">
                      2. Simular un error
                  </button>

                  <!-- boton 3= comprobar navegador -->
                  <button type="button" class="btn btn-outline-success btn-lg" onclick="comprobarNavegador()">
                      3. ¿Qué navegador soy?
                  </button>
              </div>
          </div>
      </div>
  </main>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- JS Externo -->
  <script src="js/app.js"></script>
</body>
</html>
